# /etc/default/grub.d/resize-gpu-bars.cfg — installed by the resize-gpu-bars
# package. pci=realloc lets the kernel re-size bridge windows when the GPU
# subtrees are re-enumerated after the Resizable BAR write. Sourced by
# grub-mkconfig; remove the package (or this file) and run update-grub to undo.
case " $GRUB_CMDLINE_LINUX_DEFAULT " in
  *" pci=realloc "*) ;;
  *) GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT pci=realloc" ;;
esac
