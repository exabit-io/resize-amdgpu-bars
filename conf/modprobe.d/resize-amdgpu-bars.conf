# /usr/lib/modprobe.d/resize-amdgpu-bars.conf — installed by the resize-amdgpu-bars
# package; removed with it. Do not edit: to override, drop a file of the same
# name into /etc/modprobe.d (it takes precedence).
#
# Keeps amdgpu from autoloading during early boot. resize-amdgpu-bars.service
# has to enlarge the GPUs' Resizable BARs and re-enumerate their PCI
# subtrees BEFORE amdgpu binds to them: a driver that came up first sees the
# small firmware-sized BAR and would have to be unbound, torn down and
# re-initialised, a double init/teardown that leaves KFD in a bad state.
#
# Boot order with this file in place:
#   1. the kernel enumerates PCI; no driver binds to the GPUs
#   2. resize-amdgpu-bars.service programs the BAR sizes and rescans the
#      GPU subtrees
#   3. resize-amdgpu-bars.service runs "modprobe amdgpu"
#   4. amdgpu loads once, with the large BARs, and KFD initialises cleanly
#
# "blacklist" only stops udev-triggered autoloading; an explicit
# "modprobe amdgpu" (what the service does) still works.
#
# The file is copied into the initramfs, so it takes effect at the next
# boot after update-initramfs has run (the package does that on install).

blacklist amdgpu
