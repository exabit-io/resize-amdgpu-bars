# Release: on a version tag (1.1, or v1.1) build the Debian package, attach
# it to the GitHub release for that tag, then publish that .deb to the apt
# repository on the apt-repo branch, which GitHub Pages serves at
# https://exabit-io.github.io/resize-amdgpu-bars (to-do 9.3).
#
# Re-publishing an existing release to the apt repository (a new key, a
# repaired index) is `gh workflow run release.yml -f tag=1.1`: only the
# publish job runs then, the release is left alone.
name: Release

on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: existing release tag to publish to the apt repository
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-attach:
    name: build deb and attach to the release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper scdoc lintian shellcheck
      - name: The tag must match debian/changelog
        # v7.0 tags version 7.0; a mismatch means the changelog was not
        # bumped (the 6.2 package shipped a 6.1 script this way, 4.7).
        run: |
          tag=${GITHUB_REF_NAME#v}
          ver=$(dpkg-parsechangelog -S Version)
          if [ "$tag" != "$ver" ]; then
            echo "tag v$tag but debian/changelog says $ver" >&2
            exit 1
          fi
      - name: Build the binary package
        run: dpkg-buildpackage -us -uc -b
      - name: Collect the build products
        run: |
          mkdir -p dist
          mv ../resize-amdgpu-bars_*.deb ../resize-amdgpu-bars_*.buildinfo \
             ../resize-amdgpu-bars_*.changes dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist
      - name: lintian
        run: lintian -I --fail-on warning dist/resize-amdgpu-bars_*.deb
      - name: Create the release if the tag has none, attach the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" --notes-from-tag
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
      - name: Keep the deb as a workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: resize-amdgpu-bars-deb
          path: dist/
          if-no-files-found: error

  publish-apt:
    name: publish the release deb to the apt repository
    needs: build-and-attach
    # runs after a successful build on a tag push, or alone on dispatch
    if: >-
      !cancelled() &&
      (needs.build-and-attach.result == 'success' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    concurrency: apt-repo
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tools (this ref)
        uses: actions/checkout@v4
      - name: Check out the apt-repo branch
        uses: actions/checkout@v4
        with:
          ref: apt-repo
          path: apt-repo
      - name: Install apt-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils
      - name: Fetch the release deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern '*_all.deb' --dir dist
          ls -l dist
      - name: Import the signing key
        # The Exabit, Inc. apt repository key (packages@exabit.io,
        # 6043 AD7B 3533 F615 C15F 48D0 4723 1665 0F4B E230), private half
        # in the APT_SIGNING_KEY repository secret; its public half is
        # keys/resize-amdgpu-bars.gpg on the apt-repo branch.
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --quiet --import
          gpg --batch --list-secret-keys --with-colons \
            | grep -q '^sec' || { echo 'no signing key imported' >&2; exit 1; }
      - name: Index and sign
        run: tools/apt-publish.sh apt-repo dist/*_all.deb
      - name: The published index must verify with the served public key
        run: |
          gpg --no-default-keyring \
            --keyring ./apt-repo/keys/resize-amdgpu-bars.gpg \
            --verify apt-repo/dists/stable/InRelease
      - name: Commit and push the apt-repo branch
        run: |
          cd apt-repo
          git config user.name 'Exabit release workflow'
          git config user.email 'packages@exabit.io'
          git add -A
          git commit -m "Publish resize-amdgpu-bars $TAG"
          git push origin HEAD:apt-repo
