# Release: on a version tag (1.0, or v1.0), build the Debian package and attach it to the
# GitHub release for that tag (to-do 9.3). The apt repository is fed from
# that asset by hand for now; the commented stanza at the end shows the
# equivalent of the local publish.sh.
name: Release

on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  build-and-attach:
    name: build deb and attach to the release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper scdoc lintian shellcheck
      - name: The tag must match debian/changelog
        # v7.0 tags version 7.0; a mismatch means the changelog was not
        # bumped (the 6.2 package shipped a 6.1 script this way, 4.7).
        run: |
          tag=${GITHUB_REF_NAME#v}
          ver=$(dpkg-parsechangelog -S Version)
          if [ "$tag" != "$ver" ]; then
            echo "tag v$tag but debian/changelog says $ver" >&2
            exit 1
          fi
      - name: Build the binary package
        run: dpkg-buildpackage -us -uc -b
      - name: Collect the build products
        run: |
          mkdir -p dist
          mv ../resize-amdgpu-bars_*.deb ../resize-amdgpu-bars_*.buildinfo \
             ../resize-amdgpu-bars_*.changes dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist
      - name: lintian
        run: lintian -I --fail-on warning dist/resize-amdgpu-bars_*.deb
      - name: Create the release if the tag has none, attach the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" --notes-from-tag
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
      - name: Keep the deb as a workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: resize-amdgpu-bars-deb
          path: dist/
          if-no-files-found: error

