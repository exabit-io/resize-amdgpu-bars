# CI for resize-amdgpu-bars (to-do 9.3): lint, offline harness, style checks,
# Debian package build with lintian, deb kept as a build artifact.
#
# Nothing here touches PCI: the harness runs against a fake sysfs tree
# (RESIZE_AMDGPU_BARS_SYSFS / SYSFS override) and the package build only
# installs files. Boot tests stay manual (CONTRIBUTING.md, 9.4).
name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    name: shellcheck -S style
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --version
      - name: Script, harness, style checker and tools
        # Must be clean; the formatting pass fixes or documents every note.
        run: >-
          shellcheck -S style
          resize-amdgpu-bars
          tests/test_resize_amdgpu_bars.sh
          tests/style/check.sh
          tools/experiment-resource0-resize.sh

  harness:
    name: offline harness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run the harness against the script
        run: bash tests/test_resize_amdgpu_bars.sh ./resize-amdgpu-bars

  style:
    name: bash style checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck (the checker runs it when present)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: tests/style/check.sh resize-amdgpu-bars
        # Allowed to fail until the formatting pass lands (tabs, 80
        # columns, shellcheck -S style clean). Drop continue-on-error in
        # that commit.
        continue-on-error: true
        run: tests/style/check.sh resize-amdgpu-bars

  package:
    name: dpkg-buildpackage + lintian
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper scdoc lintian shellcheck
      - name: Build the binary package
        # dh_auto_test runs the harness again as part of the build.
        run: dpkg-buildpackage -us -uc -b
      - name: Collect the build products
        run: |
          mkdir -p dist
          mv ../resize-amdgpu-bars_*.deb ../resize-amdgpu-bars_*.buildinfo \
             ../resize-amdgpu-bars_*.changes dist/
          ls -l dist
      - name: lintian
        # Fails on any warning. Today that is no-manual-page (twice) and
        # script-with-language-extension; to-do 6.1 (man pages) and 5.1
        # (the resize-amdgpu-bars binary name) remove them.
        run: lintian -I --fail-on warning dist/resize-amdgpu-bars_*.deb
      - name: Upload the deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resize-amdgpu-bars-deb
          path: dist/
          if-no-files-found: error
